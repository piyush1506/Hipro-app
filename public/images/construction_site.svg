<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="bld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Concrete building skeleton -->
  <rect x="180" y="100" width="360" height="400" fill="url(#bld)"/>
  <!-- Windows / Grid -->
  <g fill="#94A3B8" opacity="0.6">
    <rect x="210" y="130" width="40" height="50"/>
    <rect x="270" y="130" width="40" height="50"/>
    <rect x="330" y="130" width="40" height="50"/>
    <rect x="390" y="130" width="40" height="50"/>
    <rect x="450" y="130" width="40" height="50"/>

    <rect x="210" y="210" width="40" height="50"/>
    <rect x="270" y="210" width="40" height="50"/>
    <rect x="330" y="210" width="40" height="50"/>
    <rect x="390" y="210" width="40" height="50"/>
    <rect x="450" y="210" width="40" height="50"/>

    <rect x="210" y="290" width="40" height="50"/>
    <rect x="270" y="290" width="40" height="50"/>
    <rect x="330" y="290" width="40" height="50"/>
    <rect x="390" y="290" width="40" height="50"/>
    <rect x="450" y="290" width="40" height="50"/>
  </g>
  <!-- Tower Crane in Yellow -->
  <path d="M90 500 L90 140 L580 140 M140 140 L140 500" stroke="#F59E0B" stroke-width="6" fill="none"/>
  <path d="M90 140 L350 40 L650 40" stroke="#EAB308" stroke-width="5" fill="none"/>
  <line x1="350" y1="40" x2="350" y2="140" stroke="#CA8A04" stroke-width="4"/>
  <line x1="480" y1="40" x2="480" y2="180" stroke="#94A3B8" stroke-width="2"/>
  <rect x="468" y="180" width="24" height="24" fill="#E2E8F0" rx="3"/>
  <rect x="0" y="460" width="800" height="40" fill="#334155"/>
  <!-- Safety Engineer with Yellow Helmet -->
  <circle cx="680" cy="380" r="24" fill="#F59E0B"/>
  <rect x="664" y="404" width="32" height="60" fill="#0B2545"/>
  <path d="M654 374 Q680 348 706 374 Z" fill="#FACC15"/>
