<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#F1F5F9"/>
  <!-- Concrete wall texture with crack & moisture -->
  <rect x="20" y="20" width="460" height="460" rx="16" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Water dampness stain -->
  <ellipse cx="230" cy="210" rx="140" ry="90" fill="#94A3B8" opacity="0.35"/>
  <ellipse cx="210" cy="220" rx="80" ry="50" fill="#64748B" opacity="0.45"/>
  <!-- Zigzag crack line -->
  <path d="M120 70 L180 150 L140 230 L220 300 L190 380 L270 450" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M140 230 L240 210 L310 260" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Tag -->
  <rect x="130" y="410" width="240" height="38" rx="8" fill="#0B2545"/>
  <text x="250" y="434" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle">PATCH WORK AREA</text>
</svg>
